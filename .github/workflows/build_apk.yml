name: Build and Release Peace Music APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Peace Music APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Sign APK with uber-apk-signer (Debug Key)
        run: |
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar
          java -jar uber-apk-signer.jar -a build/app/outputs/flutter-apk/app-release.apk -o build/signed --allowResign
          cp build/signed/*-aligned-debugSigned.apk PeaceMusic.apk || cp build/signed/*.apk PeaceMusic.apk
          ls -la PeaceMusic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeaceMusic-v1.0.2
          path: PeaceMusic.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "Peace Music v1.0.2"
          body: |
            Peace Music v1.0.2
            - New Official App Logo (colored-logo)
            - Animated Intro Splash Screen (Logo + Peace Music & Made by Harsh)
            - Removed heart emoji from name
            - Seamless zero-friction auto-updater
          files: PeaceMusic.apk
